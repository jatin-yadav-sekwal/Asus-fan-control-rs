<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- ASUS Fan Control RS - Alternative Concept: Quad-Blade Precision Turbine -->
  <defs>
    <path id="apex-blade" d="
      M 256 224
      C 256 160, 228 100, 196 68
      C 214 62, 248 58, 276 68
      C 292 98, 302 164, 288 224 Z
    " fill="#F97316"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0F172A" />

  <!-- Outer Speed Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1E293B" stroke-width="12" />

  <!-- Speed Ticks -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="36" x2="256" y2="52" />
    <line x1="476" y1="256" x2="460" y2="256" />
    <line x1="256" y1="476" x2="256" y2="460" />
    <line x1="36" y1="256" x2="52" y2="256" />
  </g>

  <!-- 4 Symmetrical High-Flow Blades -->
  <use href="#apex-blade" />
  <use href="#apex-blade" transform="rotate(90 256 256)" />
  <use href="#apex-blade" transform="rotate(180 256 256)" />
  <use href="#apex-blade" transform="rotate(270 256 256)" />

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="48" fill="#0F172A" />
  <circle cx="256" cy="256" r="32" fill="#F97316" />
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
</svg>
