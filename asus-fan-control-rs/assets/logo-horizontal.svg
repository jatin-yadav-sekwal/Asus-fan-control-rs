<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="100%" height="100%">
  <!-- ASUS Fan Control RS - Horizontal Brand Lockup -->
  <defs>
    <path id="h-blade" d="
      M 70 56
      C 66 42, 55 24, 40 12
      C 45 8, 55 6, 68 8
      C 82 11, 90 24, 84 52
      C 81 57, 75 58, 70 56 Z
    " fill="#F97316"/>
  </defs>

  <!-- Icon Mark (Scaled & Offset) -->
  <g transform="translate(16, 10)">
    <!-- Outer Control Arc Segments -->
    <g stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M 70 8 A 52 52 0 0 1 115 34" />
      <path d="M 115 86 A 52 52 0 0 1 70 112" />
      <path d="M 25 86 A 52 52 0 0 1 25 34" />
    </g>

    <!-- Calibration Pips -->
    <g fill="#F97316">
      <circle cx="70" cy="8" r="2.5" />
      <circle cx="115" cy="34" r="2.5" />
      <circle cx="115" cy="86" r="2.5" />
      <circle cx="70" cy="112" r="2.5" />
      <circle cx="25" cy="86" r="2.5" />
      <circle cx="25" cy="34" r="2.5" />
    </g>

    <!-- Impeller Blades -->
    <use href="#h-blade" />
    <use href="#h-blade" transform="rotate(120 70 60)" />
    <use href="#h-blade" transform="rotate(240 70 60)" />

    <!-- Center Hub -->
    <circle cx="70" cy="60" r="14" fill="#0F172A" />
    <circle cx="70" cy="60" r="9" fill="#F97316" />
    <circle cx="70" cy="60" r="4" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Main Title -->
    <text x="160" y="66" font-size="32" font-weight="900" fill="#0F172A" letter-spacing="1.5">
      ASUS FAN CONTROL
    </text>

    <!-- Rust Badge -->
    <rect x="522" y="41" width="46" height="28" rx="6" fill="#F97316" />
    <text x="545" y="61" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      RS
    </text>

    <!-- Subtitle / Tagline -->
    <text x="162" y="94" font-size="13" font-weight="600" fill="#64748B" letter-spacing="2">
      LOW-OVERHEAD HARDWARE THERMAL SUITE
    </text>
  </g>
</svg>
