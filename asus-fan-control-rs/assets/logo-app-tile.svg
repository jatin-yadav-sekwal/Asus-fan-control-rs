<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- ASUS Fan Control RS - Modern Flat App Icon Tile -->
  <defs>
    <path id="fan-blade-tile" d="
      M 256 218
      C 246 178, 214 122, 172 86
      C 186 74, 214 68, 252 74
      C 294 82, 316 120, 298 206
      C 288 222, 270 224, 256 218 Z
    " fill="#F97316"/>
  </defs>

  <!-- Deep Slate Background Squircle -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Calibration Dial Arcs (Flat Minimalist Hardware Framing) -->
  <g stroke="#334155" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M 256 52 A 204 204 0 0 1 433 154" />
    <path d="M 433 358 A 204 204 0 0 1 256 460" />
    <path d="M 79 358 A 204 204 0 0 1 79 154" />
  </g>

  <!-- Precision Calibration Pips -->
  <g fill="#F97316">
    <circle cx="256" cy="52" r="6" />
    <circle cx="433" cy="154" r="6" />
    <circle cx="433" cy="358" r="6" />
    <circle cx="256" cy="460" r="6" />
    <circle cx="79" cy="358" r="6" />
    <circle cx="79" cy="154" r="6" />
  </g>

  <!-- Fan Impeller Group (Slightly Scaled for Balanced Squircle Proportions) -->
  <g transform="matrix(0.92 0 0 0.92 20.48 20.48)">
    <!-- 3 Aerodynamic Blades -->
    <use href="#fan-blade-tile" />
    <use href="#fan-blade-tile" transform="rotate(120 256 256)" />
    <use href="#fan-blade-tile" transform="rotate(240 256 256)" />

    <!-- Center Spindle & Motor Hub -->
    <circle cx="256" cy="256" r="44" fill="#0F172A" />
    <circle cx="256" cy="256" r="28" fill="#F97316" />
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" />
  </g>
</svg>
