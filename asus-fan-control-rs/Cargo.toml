[workspace]
resolver = "2"
members = [
    "crates/asus-driver",
    "crates/fan-engine",
    "crates/win-os",
    "crates/asus-fan-app",
]
# One-off asset generator (SVG -> .ico). Kept out of the workspace so a normal
# `cargo build` does not pay for resvg.
exclude = ["tools/svg2ico"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AsusFanControl Contributors"]
license = "MIT"

[workspace.dependencies]
libloading = "0.8"
thiserror = "2.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release binaries shipped on GitHub: full LTO, single codegen unit and
# stripped symbols keep the EXE small and the 1 Hz control loop cheap.
# panic stays on unwind so a panicking task cannot abort the whole process.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
